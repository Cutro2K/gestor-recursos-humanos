# Se suma a src/main/resources/application.properties solo al correr los tests.
# Clave RSA exclusiva de los tests (no sirve para nada fuera de ellos), así los tests que
# levantan el contexto de Spring no dependen de que cada integrante haya generado la suya.
auth.jwt.clave-privada=src/test/resources/jwt-test-private.pem
