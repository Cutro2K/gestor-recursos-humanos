spring.application.name=api

#--- DATABASE SERVER CONFIG ---#
server.port=8080

#--- CSV multipart (CU06) ---#
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

#--- PostgreSQL Connection ---#
# Exportar DB_URL como variable de entorno si tu url a la base de datos es diferente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deso_db}
# Exportar DB_USERNAME como variable de entorno si tu username es diferente
spring.datasource.username=${DB_USERNAME:postgres}
# Exportar DB_PASSWORD como variable de entorno si tu password es diferente
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#--- JPA Hibernate ---#
# Dialecto específico de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto define qué hace Hibernate con las tablas al iniciar:
# - update: Crea tablas o columnas si faltan, pero NO borra datos existentes (ideal para desarrollo diario).
# - validate: Solo verifica que las tablas coincidan con las clases @Entity.
# - create-drop: Borra y crea todo de nuevo cada vez que iniciás la app (útil solo para pruebas).
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#--- Log file config ---#
# Nombre o ruta del archivo de log (puede terminar en .txt o .log)
logging.file.name=logs/api.log

# (Opcional) Política de rotación automática para que el archivo no crezca infinitamente
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
