spring.application.name=api

#--- DATABASE SERVER CONFIG ---#
server.port=8080

#--- CSV multipart (CU06) ---#
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

#--- PostgreSQL Connection ---#
# Exportar DB_URL como variable de entorno si tu url a la base de datos es diferente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deso_db}
# Exportar DB_USERNAME como variable de entorno si tu username es diferente
spring.datasource.username=${DB_USERNAME:postgres}
# Exportar DB_PASSWORD como variable de entorno si tu password es diferente
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#--- LDAP de consultores (CU 01) ---#
# Por defecto apunta al contenedor "ldap" de docker-compose.yml. Para usar otro directorio
# (por ejemplo el de una organización real) alcanza con exportar estas variables.
spring.ldap.urls=${LDAP_URL:ldap://localhost:389}
spring.ldap.base=${LDAP_BASE:dc=deso,dc=local}
# Cuenta con la que la API busca al consultor antes de validar su contraseña
spring.ldap.username=${LDAP_USERNAME:uid=admin,dc=deso,dc=local}
spring.ldap.password=${LDAP_PASSWORD:admin}
# Rama del directorio donde están los consultores, relativa a spring.ldap.base
ldap.consultores.ou=${LDAP_CONSULTORES_OU:ou=consultores}

#--- JPA Hibernate ---#
# Dialecto específico de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto define qué hace Hibernate con las tablas al iniciar. Usamos none: las tablas
# las define únicamente db/01-schema.sql (cargado junto con db/02-data.sql) y Hibernate
# no las crea ni las modifica. Otras opciones:
# - update: crea tablas o columnas que falten según las clases @Entity.
# - validate: verifica que las tablas coincidan con las clases @Entity (hoy falla, por
#   ejemplo candidato.genero es CHAR(1) en el esquema y VARCHAR(1) en la entidad).
# - create-drop: borra y crea todo cada vez que inicia la app (solo para pruebas).
spring.jpa.hibernate.ddl-auto=none

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#--- Log file config ---#
# Nombre o ruta del archivo de log (puede terminar en .txt o .log)
logging.file.name=logs/api.log

# (Opcional) Política de rotación automática para que el archivo no crezca infinitamente
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
